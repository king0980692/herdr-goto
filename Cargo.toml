[package]
name = "herdr-goto"
version = "0.1.0"
edition = "2021"
description = "Tree navigator popup for herdr: machine > workspace > pane with live status, fuzzy search, vim keys, MRU jump, preview and worktrees"
license = "MIT"
repository = "https://github.com/king0980692/herdr-goto"
readme = "README.md"
keywords = ["herdr", "tui", "terminal", "workspace"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde_json = "1"
unicode-width = "0.2"
fuzzy-matcher = "0.3"

[profile.release]
opt-level = 2
strip = true
