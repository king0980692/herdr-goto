name: Release binaries

# Push a tag like v0.1.0 (matching Cargo.toml's version) to build static
# binaries for every target and publish them on a GitHub release. Asset names
# carry the target triple so `mise use github:king0980692/herdr-goto` can pick
# the right one for the host.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.triple }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-musl
          - os: macos-latest
            triple: x86_64-apple-darwin
          - os: macos-latest
            triple: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate=$(grep -E '^version *= *"' Cargo.toml | head -n1 | sed -E 's/^version *= *"([^"]+)".*/\1/')
          lock=$(awk '/^name = "herdr-goto"$/ { getline; sub(/^version = "/, ""); sub(/"$/, ""); print; exit }' Cargo.lock)
          test "$version" = "$crate" || { echo "tag $version != Cargo.toml $crate" >&2; exit 1; }
          test "$version" = "$lock" || { echo "tag $version != Cargo.lock $lock" >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - name: Install musl linker
        if: endsWith(matrix.triple, '-unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --target ${{ matrix.triple }}
      - name: Stage asset and checksum
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          triple="${{ matrix.triple }}"
          name="herdr-goto-${GITHUB_REF_NAME}-$triple"
          # tarball so mise extracts it and finds the executable inside
          tar -C "target/$triple/release" -czf "dist/$name.tar.gz" herdr-goto
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$name.tar.gz"; else shasum -a 256 "$name.tar.gz"; fi > CHECKSUMS.part
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.triple }}
          path: dist/*

  publish:
    name: publish assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble release files
        run: |
          mkdir release
          find artifacts -type f ! -name 'CHECKSUMS.part' -exec cp {} release/ \;
          cat artifacts/*/CHECKSUMS.part > release/SHA256SUMS
          ls -la release
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --draft
          gh release upload "$GITHUB_REF_NAME" release/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
